# Local Postgres + pgvector for the integration test and the Postgres-backed demo.
# Synthetic data only. Schema and seed are applied by scripts/seed_db.py, not by this file,
# so the same steps run locally and in CI.
name: matchfluence-matching

services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: matching
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matching"]
      interval: 2s
      timeout: 3s
      retries: 30
