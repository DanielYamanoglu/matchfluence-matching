<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="960" height="340" rx="12" fill="#0f172a"/>
  <text x="480" y="36" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="600">Two-stage matching: retrieve with pgvector, re-rank with explainable rules</text>

  <g font-size="14" fill="#e2e8f0" text-anchor="middle">
    <rect x="24" y="110" width="150" height="100" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="99" y="146" font-weight="600">Brand brief</text>
    <text x="99" y="168" font-size="12" fill="#94a3b8">text + hard filters</text>
    <text x="99" y="186" font-size="12" fill="#94a3b8">country, followers, budget</text>

    <rect x="214" y="110" width="150" height="100" rx="10" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="289" y="146" font-weight="600">Embedding</text>
    <text x="289" y="168" font-size="12" fill="#94a3b8">MiniLM-L6-v2 (384-d)</text>
    <text x="289" y="186" font-size="12" fill="#94a3b8">or TF-IDF fallback</text>

    <rect x="404" y="110" width="150" height="100" rx="10" fill="#1e293b" stroke="#34d399" stroke-width="2"/>
    <text x="479" y="146" font-weight="600">Vector retrieval</text>
    <text x="479" y="168" font-size="12" fill="#94a3b8">pgvector cosine top 5k</text>
    <text x="479" y="186" font-size="12" fill="#94a3b8">or in-memory numpy</text>

    <rect x="594" y="110" width="150" height="100" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="669" y="146" font-weight="600">Hybrid re-rank</text>
    <text x="669" y="168" font-size="12" fill="#94a3b8">semantic + audience,</text>
    <text x="669" y="186" font-size="12" fill="#94a3b8">engagement, budget, past</text>

    <rect x="784" y="110" width="152" height="100" rx="10" fill="#1e293b" stroke="#f472b6" stroke-width="2"/>
    <text x="860" y="146" font-weight="600">Explained matches</text>
    <text x="860" y="168" font-size="12" fill="#94a3b8">top k with per-feature</text>
    <text x="860" y="186" font-size="12" fill="#94a3b8">score breakdown</text>
  </g>

  <g stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)">
    <line x1="176" y1="160" x2="210" y2="160"/>
    <line x1="366" y1="160" x2="400" y2="160"/>
    <line x1="556" y1="160" x2="590" y2="160"/>
    <line x1="746" y1="160" x2="780" y2="160"/>
  </g>

  <g font-size="12" fill="#94a3b8" text-anchor="middle">
    <rect x="404" y="244" width="150" height="48" rx="8" fill="#1e293b" stroke="#475569" stroke-dasharray="5 4"/>
    <text x="479" y="264" fill="#e2e8f0">creator_embeddings</text>
    <text x="479" y="282">Postgres + HNSW index</text>
    <line x1="479" y1="244" x2="479" y2="214" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="289" y="268">Creator profiles are embedded</text>
    <text x="289" y="284">offline and upserted on POST /creators</text>
    <line x1="364" y1="262" x2="400" y2="262" stroke="#475569" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="760" y="268">Weights are explicit and tunable</text>
    <text x="760" y="284">so every ranking can be audited</text>
  </g>
</svg>
